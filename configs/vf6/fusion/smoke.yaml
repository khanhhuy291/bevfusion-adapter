# Same clip in both splits, exclusively for pipeline/model debugging.
dataset_root: data/vf6-fusion-smoke
allow_smoke_test: true
train_augmentation: false
max_epochs: 2
# Match the FP32 forward/backward checker before introducing mixed precision.
fp16: null
data:
  workers_per_gpu: 0
lr_config:
  warmup_iters: 1
log_config:
  interval: 1
