# Inherits the VF6 LiDAR encoder, detection head and optimizer from ../default.yaml.
dataset_root: data/vf6-fusion
image_size: [384, 480]
input_modality:
  use_camera: true

train_pipeline:
  - type: LoadMultiViewImageFromFiles
  - type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: 5
    use_dim: 5
    reduce_beams: null
  - type: LoadAnnotations3D
    with_bbox_3d: true
    with_label_3d: true
    with_attr_label: false
  - type: ImageAug3D
    final_dim: ${image_size}
    resize_lim: ${[0.5, 0.55] if train_augmentation else [0.5, 0.5]}
    bot_pct_lim: [0.0, 0.0]
    rot_lim: [-2.0, 2.0]
    rand_flip: true
    is_train: ${train_augmentation}
  - type: GlobalRotScaleTrans
    resize_lim: [0.95, 1.05]
    rot_lim: [-0.2, 0.2]
    trans_lim: 0.1
    is_train: ${train_augmentation}
  - type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  - type: ObjectRangeFilter
    point_cloud_range: ${point_cloud_range}
  - type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  - type: PointShuffle
  - type: DefaultFormatBundle3D
    classes: ${object_classes}
  - type: Collect3D
    keys: [img, points, gt_bboxes_3d, gt_labels_3d]
    meta_keys: [camera_intrinsics, camera2ego, lidar2ego, lidar2camera, camera2lidar,
                lidar2image, img_aug_matrix, lidar_aug_matrix]

test_pipeline:
  - type: LoadMultiViewImageFromFiles
  - type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: 5
    use_dim: 5
    reduce_beams: null
  - type: ImageAug3D
    final_dim: ${image_size}
    resize_lim: [0.5, 0.5]
    bot_pct_lim: [0.0, 0.0]
    rot_lim: [0.0, 0.0]
    rand_flip: false
    is_train: false
  - type: GlobalRotScaleTrans
    resize_lim: [1.0, 1.0]
    rot_lim: [0.0, 0.0]
    trans_lim: 0.0
    is_train: false
  - type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  - type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  - type: DefaultFormatBundle3D
    classes: ${object_classes}
    with_gt: false
    with_label: false
  - type: Collect3D
    keys: [img, points]
    meta_keys: [camera_intrinsics, camera2ego, lidar2ego, lidar2camera, camera2lidar,
                lidar2image, img_aug_matrix, lidar_aug_matrix]

model:
  encoders:
    camera:
      backbone:
        type: ResNet
        depth: 50
        num_stages: 4
        out_indices: [1, 2, 3]
        frozen_stages: -1
        norm_cfg: {type: BN2d, requires_grad: true}
        norm_eval: false
        # No automatic network download during company GPU smoke tests.
        init_cfg: null
      neck:
        type: GeneralizedLSSFPN
        in_channels: [512, 1024, 2048]
        out_channels: 256
        start_level: 0
        num_outs: 3
        norm_cfg: {type: BN2d, requires_grad: true}
        act_cfg: {type: ReLU, inplace: true}
        upsample_cfg: {mode: bilinear, align_corners: false}
      vtransform:
        type: DepthLSSTransform
        in_channels: 256
        out_channels: 80
        image_size: ${image_size}
        feature_size: ${[image_size[0] // 8, image_size[1] // 8]}
        xbound: [-51.2, 51.2, 0.4]
        ybound: [-51.2, 51.2, 0.4]
        zbound: [-3.0, 5.0, 8.0]
        dbound: [1.0, 60.0, 1.0]
        downsample: 2
  fuser:
    type: ConvFuser
    in_channels: [80, 256]
    out_channels: 256
